[project]
name = "ive-meta-hackathon"
version = "0.1.0"
description = "Sketch-to-Flutter pipeline on Meta Model API: eval harness, compile runner, store-pack generator."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "meta-sam-parser>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_client", "src/sketch2layout", "src/codegen", "src/compile_runner", "src/storepack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

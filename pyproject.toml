[project]
name = "ive-meta-hackathon"
version = "0.1.0"
description = "Model-agnostic Flutter app-shipping harness: capsule, guards, preflight, and Pilot layer."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pillow>=11.0",
]

[project.scripts]
harness = "harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_client", "src/harness", "src/preflight", "src/pilot", "src/storepack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "scripts/day1"]

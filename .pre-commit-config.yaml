# Secret scanning on every commit. Requires the gitleaks binary on PATH
# (pinned to v8.30.1 for this repo; see README "Setup").
# Install hooks once with:  uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false
        always_run: true

name: rocket_capsule
description: Rocket capsule Flutter template with protected core and editable app layer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  flutter_markdown: ^0.7.7+1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  purchases_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  fonts:
    - family: KitSans
      fonts:
        - asset: lib/core/kit/fonts/DMSans-Regular.ttf
        - asset: lib/core/kit/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: lib/core/kit/fonts/DMSans-Bold.ttf
          weight: 700
  assets:
    - assets/legal/terms.md
    - assets/legal/privacy.md
    - assets/onboarding/onboarding.json
    - lib/app/design_tokens.json
    - lib/core/kit/photos/
